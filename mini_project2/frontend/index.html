<!DOCTYPE html>
<html>
<head>
    <title>Resume AI Assistant</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div class="container">

        <h1>Hello, I'm Subhanker!</h1>

        <p>This is my portfolio chatbot. Ask me anything about my resume.</p>

        <div id="chat-box"></div>

        <div class="input-area">

            <input
                type="text"
                id="question"
                placeholder="Ask a question..."
            >

            <button onclick="sendMessage()">
                Send
            </button>

        </div>

    </div>

    <script src="/static/script.js"></script>

</body>
</html>
